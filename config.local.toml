# Local overrides for crw-server. crw loads this file from its working directory.
# Host, port, and the Chrome DevTools URL are set by crawl.ps1 (env vars win over this file).
# Full reference: https://docs.fastcrw.com/configuration/

[server]
# crw's limit on incoming API requests, shared by all clients (default 10/s). MCP clients
# open several connections at once on startup and were getting HTTP 429, so turn it off.
# 0 = unlimited. This does not change how fast sites are crawled: see [crawler] below.
rate_limit_rps = 0

[renderer]
# Several agents scrape at once. Chrome on Windows has plenty of RAM, so render up to
# 8 pages in parallel (crw's default is 4).
pool_size = 8
# A thin page used to wait the full 8 s for an app shell that never comes: plain pages
# such as example.com or Hacker News took 8.2 s each and filled the pool. 3 s is the
# budget crw's own benchmark validated, and fast_ready exits as soon as the page has
# settled (it still never snapshots an empty shell).
chrome_spa_selector_max_ms = 3000
chrome_fast_ready = true
# HTTP first; switch to headless Chrome only when a page looks like a JS app.
# Force it per request with "renderJs": true.
mode = "auto"
# Generous budget for a slow or jittery home connection (default 30000).
page_timeout_ms = 45000
# HTTP first, browser when needed (the default). Forcing every page through the
# browser (render_js_default = true) tested worse: Cloudflare challenged the browser
# on sites the plain fetch reads fine.
# render_js_default = true
pool_size = 4

[mcp]
# Drop cloud-billing fields (creditCost/creditsUsed) from MCP tool results; they are
# meaningless when self-hosted and only cost agents tokens.
hide_credits = true

[crawler]
# Ignore robots.txt (it otherwise limits crawl and map). The rate limits below still apply.
respect_robots_txt = false
# Be polite: we crawl from a home IP, so keep the request rate modest.
max_concurrency = 5
requests_per_second = 3.0

# local-crawl's Docker engine: fastCRW's self-hosting stack, combined with the local
# engine's real Chrome. Started and stopped by `crawl.ps1 -Engine docker`; first-time
# image setup is `setup.ps1 -Docker`. SEARXNG_SECRET_KEY comes from docker/.env
# (created by crawl.ps1, never committed).
#
# crw falls back through its tiers per request:
#   plain HTTP -> Chrome-impersonating HTTP (real Chrome TLS fingerprint, no browser)
#   -> your real Chrome on the host, through the DevTools filter
#   -> Camoufox (anti-detect Firefox)
# plus SearXNG for web search.
#
# fastCRW's own browsers (browserless "stealth" Chromium and LightPanda) aren't used:
# measured, the host's real Chrome beat both by a wide margin (stealthcheck 92 vs 25
# for browserless; LightPanda failed basic fingerprint checks). See the README.
name: local-crawl

services:
  crw:
    # fastCRW v0.37.2 plus the fixes in docker/crw-patches, built with fastCRW's own
    # Dockerfile and the optional Camoufox tier compiled in (the published image,
    # ghcr.io/fastcrw/crw, only has the cdp + impersonated features). setup.ps1 -Docker
    # checks the source out into build/crw-src and applies the patches first.
    image: local-crawl/crw:0.37.2-fixes
    build:
      context: ../build/crw-src
      args:
        CARGO_PKGS: "-p crw-server --features cdp,impersonated,camoufox"
    ports:
      # Same port as the local engine, so MCP clients, Tailscale Serve and the tray
      # work unchanged. Loopback only.
      - "127.0.0.1:3002:3000"
    depends_on:
      camoufox:
        condition: service_started
      searxng:
        condition: service_healthy
    environment:
      - RUST_LOG=info
      - CRW_CONFIG=config.docker
      # The host's Chrome, through the DevTools filter (crawl.ps1 starts both first).
      # Docker Desktop forwards host.docker.internal to the PC's loopback-only ports.
      - CRW_RENDERER__CHROME__WS_URL=ws://host.docker.internal:${CRW_CDP_PORT:-9223}/
      # The host browser's real User-Agent for the plain HTTP tier (set by crawl.ps1).
      - CRW_CRAWLER__USER_AGENT=${CRW_USER_AGENT:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config.docker.toml:/app/config.docker.toml:ro
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 512
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Web search backend for /v1/search and the crw_search MCP tool.
  searxng:
    image: searxng/searxng:2026.5.9-0cba32c15
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      # SearXNG reads SEARXNG_SECRET; docker/.env names it SEARXNG_SECRET_KEY.
      - SEARXNG_SECRET=${SEARXNG_SECRET_KEY}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    tmpfs:
      - /tmp:size=64m
      - /var/cache/searxng:size=128m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Camoufox: an anti-detect Firefox, used as the last fallback for pages that block
  # the Chrome-based tiers (e.g. a Cloudflare 403).
  camoufox:
    image: ghcr.io/jo-inc/camofox-browser:latest
    environment:
      - CAMOFOX_PORT=9377
      - CAMOFOX_CRASH_REPORT_ENABLED=false
    shm_size: "2g"
    restart: unless-stopped
    mem_limit: 3g
    memswap_limit: 3g
